<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Face finder debug</title>
<style>body{font:14px/1.4 ui-monospace,monospace;margin:16px;background:#111;color:#ddd}pre{white-space:pre-wrap}</style>
<script type="module">
// Intermediate readbacks for the GPU face finder: detector logits, ROI list, face count.
import { requestDevice } from '../gpu/engine.js';
import { FrameTexture } from '../gpu/frame.js';
import { FaceFinder } from '../gpu/facefinder.js';
import { UP } from './upstream.js';
const el = document.getElementById('log'), log = t => { el.textContent += t + '\n'; };
try {
  const { device } = await requestDevice();
  const ff = await FaceFinder.create(device, { base: '../models/' });
  const frame = new FrameTexture(device);
  const img = new Image(); img.src = UP + 'sample.jpg'; await img.decode();
  const cv = Object.assign(document.createElement('canvas'), { width: 1280, height: 720 }), x = cv.getContext('2d');
  x.fillStyle = '#3a3f4a'; x.fillRect(0, 0, 1280, 720); x.drawImage(img, 640 - 324, 36, 648, 648);
  frame.upload(cv, 1280, 720);
  const levels = frame.tex.mipLevelCount;
  ff.setFrame(1280, 720, levels);
  const enc = device.createCommandEncoder();
  frame.mips(enc, levels - 1);
  device.pushErrorScope('validation');
  ff.encode(enc, frame.view);
  const o = ff.det.output(0, 't160'), o2 = ff.det.output(0, 't163');
  const n = ff.det.arenaBytes;
  const rb = device.createBuffer({ size: n, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const rb2 = device.createBuffer({ size: 64, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const rb3 = device.createBuffer({ size: 16, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  enc.copyBufferToBuffer(ff.det.act, 0, rb, 0, n);
  enc.copyBufferToBuffer(ff.rois, 0, rb2, 0, 64);
  enc.copyBufferToBuffer(ff.lmBatch, 0, rb3, 0, 16);
  device.queue.submit([enc.finish()]);
  log('validation: ' + ((await device.popErrorScope())?.message || 'none'));
  await Promise.all([rb.mapAsync(GPUMapMode.READ), rb2.mapAsync(GPUMapMode.READ), rb3.mapAsync(GPUMapMode.READ)]);
  const f = new Float32Array(rb.getMappedRange());
  let mx = -1e9, nan = 0;
  for (const h of [o, o2]) for (let c = 0; c < h.C; c++) for (let p = 0; p < h.H * h.W; p++) { const v = f[(h.off + (c >> 2) * h.H * h.W + p) * 4 + (c & 3)]; if (Number.isNaN(v)) nan++; mx = Math.max(mx, v); }
  log(`max class logit ${mx.toFixed(3)} (sigmoid ${(1 / (1 + Math.exp(-mx))).toFixed(3)}), NaNs ${nan}`);
  log('lmBatch ' + Array.from(new Int32Array(rb3.getMappedRange())));
  log('rois ' + Array.from(new Float32Array(rb2.getMappedRange())).map(v => v.toFixed(1)));
} catch (e) { log(String(e.stack || e)); }
window.__dbg = 1;
</script></head><body><pre id="log"></pre></body></html>
